[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-erp"
version = "0.1.0"
description = "Single-user offline desktop School ERP for small Indian schools"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Parishram" }]
readme = "README.md"
dependencies = [
    "PySide6==6.7.2",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "reportlab==4.2.2",
    "pyqtgraph==0.13.7",
    "qtawesome==1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-qt==4.4.0",
    "ruff==0.6.2",
    "pyinstaller==6.10.0",
]

[project.scripts]
school-erp = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*", "build*", "dist*"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (Qt patterns)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning",
]
